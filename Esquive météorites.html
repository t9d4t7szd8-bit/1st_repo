<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Esquive météorites</title>
<style>
:root{--bg:#12233d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
#m{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(244,241,222,.14);font-size:20px;color:#f4f1de;touch-action:manipulation}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="m" aria-label="Son">🔊</button>
<script>
const BG='#12233d',SHIP='#ffd23f',GUN='#e0a800',ROCK='#e4572e',INK='#f4f1de',DOT='#2d4466',UFO='#7ee0c3',DOME='#c9fff0';
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;
function size(){const d=window.devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();

/* ---------- Son ---------- */
let ac,mg,mus,muted=false;
const NOTES=[220,261.6,293.7,329.6,392,440,523.3,659.3];
const PAT=[0,2,4,2,5,4,2,1,0,3,5,3,6,5,3,2];
const BASS=[110,87.3,98,82.4];
let step=0,nextT=0;
function audio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  ac=new A();mg=ac.createGain();mg.gain.value=muted?0:.6;mg.connect(ac.destination);
  mus=ac.createGain();mus.gain.value=.22;mus.connect(mg);
  nextT=ac.currentTime+.1;setInterval(sched,100);
}
function note(f,d,type,v,t0){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(mus);o.start(t0);o.stop(t0+d+.05);
}
function sched(){
  while(nextT<ac.currentTime+.3){
    const i=step%16;
    note(NOTES[PAT[i]]*(i%8===7?2:1),.7,'triangle',.5,nextT);
    if(i%8===0)note(BASS[Math.floor(step/8)%4],2.2,'sine',.8,nextT);
    step++;nextT+=.28;
  }
}
function blip(f1,f2,d,type,v){
  if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02);
}
const mb=document.getElementById('m');
mb.addEventListener('click',()=>{muted=!muted;mb.textContent=muted?'🔇':'🔊';if(mg)mg.gain.value=muted?0:.6;audio()});

/* ---------- Jeu ---------- */
let state='ready',ship,rocks=[],bullets=[],parts=[],ufo=null;
let t=0,dist=0,kills=0,best=0,spawn=0,fireT=0,ufoT=8,endAt=0,heat=0,cool=0,hot=false;
const stars=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),v:20+Math.random()*40}));
const spd=()=>Math.min(2.6,1+t*0.025);
const pts=()=>Math.floor(dist/10)+kills*500;

function reset(){ship={x:W/2,y:H-90,r:16};rocks=[];bullets=[];parts=[];ufo=null;t=0;dist=0;kills=0;spawn=.5;fireT=0;ufoT=8;heat=0;cool=0;hot=false;state='play'}

function makeRock(){
  const r=14+Math.random()*22,n=8,p=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=.75+Math.random()*.35;p.push([Math.cos(a)*r*k,Math.sin(a)*r*k])}
  rocks.push({x:r+Math.random()*(W-2*r),y:-r*2,r,hp:Math.ceil(r/9),flash:0,vy:(130+Math.random()*90)*spd(),rot:0,vr:(Math.random()-.5)*3,pts:p});
}
function boom(px,py,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*180;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,col})}}

let lastX=0,lastY=0,drag=false;
c.addEventListener('pointerdown',e=>{
  audio();c.setPointerCapture(e.pointerId);drag=true;lastX=e.clientX;lastY=e.clientY;
  if(state==='ready'||(state==='over'&&performance.now()>endAt))reset();
});
c.addEventListener('pointermove',e=>{
  if(!drag||state!=='play')return;
  ship.x=Math.max(ship.r,Math.min(W-ship.r,ship.x+(e.clientX-lastX)*1.4));
  ship.y=Math.max(H*.7+20,Math.min(H-40,ship.y+(e.clientY-lastY)*1.4));lastX=e.clientX;lastY=e.clientY;
});
['pointerup','pointercancel'].forEach(ev=>c.addEventListener(ev,()=>drag=false));

function update(dt){
  const sp=state==='play'?spd():1;
  stars.forEach(s=>{s.y+=s.v*sp*dt/H;if(s.y>1){s.y=0;s.x=Math.random()}});
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
  if(state!=='play')return;
  t+=dt;dist+=25*sp*dt;

  fireT-=dt;
  if(hot){cool-=dt;if(cool<=0){hot=false;heat=0;blip(500,900,.15,'sine',.08)}}
  else if(drag){heat+=dt;if(heat>=5){hot=true;cool=5;blip(200,60,.4,'sawtooth',.15)}}
  else heat=Math.max(0,heat-dt);
  if(drag&&!hot&&fireT<=0){bullets.push({x:ship.x,y:ship.y-32});fireT=.13;blip(900,300,.07,'square',.035)}
  bullets.forEach(b=>b.y-=720*dt);bullets=bullets.filter(b=>b.y>-20);

  spawn-=dt;
  if(spawn<=0){makeRock();spawn=Math.max(.25,.8-t*.012)}
  for(const r of rocks){
    r.y+=r.vy*dt;r.rot+=r.vr*dt;
    if(Math.hypot(r.x-ship.x,r.y-ship.y)<ship.r*.8+r.r*.85){
      state='over';best=Math.max(best,pts());endAt=performance.now()+500;
      boom(ship.x,ship.y,SHIP,20);blip(400,60,.9,'triangle',.3);
    }
  }
  for(const r of rocks){
    r.flash-=dt;
    for(const b of bullets){
      if(b.y>0&&Math.hypot(b.x-r.x,b.y-r.y)<r.r){
        b.y=-99;r.hp--;r.flash=.06;
        if(r.hp<=0){boom(r.x,r.y,ROCK,10);blip(250,50,.25,'sawtooth',.12);r.y=H+999;break}
        blip(200,120,.05,'square',.04);
      }
    }
  }
  rocks=rocks.filter(r=>r.y<H+r.r*2);

  if(!ufo){ufoT-=dt;if(ufoT<=0){ufo={cx:W/2,a:0,age:0,hp:6,flash:0,out:false,x:W/2,y:-40};blip(300,700,.5,'sine',.12)}}
  else{
    const u=ufo,rx=Math.min(W*.3,120),ry=50,cy=H*.3;
    u.age+=dt;u.a+=1.7*dt;u.flash-=dt;
    u.cx+=(ship.x-u.cx)*Math.min(1,.8*dt);
    u.cx=Math.max(rx+30,Math.min(W-rx-30,u.cx));
    const en=Math.min(1,u.age/1.2);
    u.x=u.cx+Math.cos(u.a)*rx;
    u.y=-40+(cy+Math.sin(u.a)*ry+40)*en;
    if(u.age>14)u.out=true;
    if(u.out){u.y-=(u.age-14)*(u.age-14)*40+60;if(u.y<-80){ufo=null;ufoT=8+Math.random()*4}}
    else for(const b of bullets){
      const dx=(b.x-u.x)/38,dy=(b.y-u.y)/20;
      if(dx*dx+dy*dy<1){
        b.y=-99;u.hp--;u.flash=.08;blip(300,150,.05,'sawtooth',.05);
        if(u.hp<=0){
          kills++;boom(u.x,u.y,UFO,24);blip(400,40,.6,'sawtooth',.25);blip(800,100,.4,'square',.1);
          ufo=null;ufoT=10+Math.random()*5;break;
        }
      }
    }
  }
}

function text(s,y,px,a){x.fillStyle=INK;x.globalAlpha=a||1;x.font='600 '+px+'px system-ui,-apple-system,sans-serif';x.textAlign='center';x.fillText(s,W/2,y);x.globalAlpha=1}

function draw(){
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  x.fillStyle=DOT;stars.forEach(s=>x.fillRect(s.x*W,s.y*H,2,2));
  x.fillStyle=ROCK;
  for(const r of rocks){
    x.fillStyle=r.flash>0?'#ffb199':ROCK;x.save();x.translate(r.x,r.y);x.rotate(r.rot);x.beginPath();
    r.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
    x.closePath();x.fill();x.restore();
  }
  x.fillStyle=INK;bullets.forEach(b=>x.fillRect(b.x-1.5,b.y-5,3,10));
  if(ufo){
    const u=ufo;
    x.fillStyle=u.flash>0?'#fff':UFO;x.beginPath();x.ellipse(u.x,u.y,34,12,0,0,6.283);x.fill();
    x.fillStyle=DOME;x.beginPath();x.ellipse(u.x,u.y-6,16,12,0,Math.PI,6.283);x.fill();
    x.fillStyle=BG;[-18,0,18].forEach(o=>x.fillRect(u.x+o-2,u.y-1,4,4));
    x.fillStyle=DOT;x.fillRect(u.x-20,u.y+20,40,4);x.fillStyle=UFO;x.fillRect(u.x-20,u.y+20,40*u.hp/6,4);
  }
  if(state!=='over'&&ship){
    x.fillStyle=hot?'#ff3b3b':GUN;x.fillRect(ship.x-3,ship.y-32,6,14);
    x.fillStyle=SHIP;x.beginPath();
    x.moveTo(ship.x,ship.y-20);x.lineTo(ship.x+15,ship.y+14);x.lineTo(ship.x,ship.y+7);x.lineTo(ship.x-15,ship.y+14);
    x.closePath();x.fill();
  }
  parts.forEach(p=>{x.fillStyle=p.col;x.globalAlpha=Math.max(0,p.l/.6);x.fillRect(p.x-2,p.y-2,4,4)});x.globalAlpha=1;
  if(state==='play'){
    x.textAlign='left';x.fillStyle=INK;x.font='600 22px system-ui,sans-serif';x.fillText(pts()+' pts',16,32);
    x.globalAlpha=.75;x.font='600 14px system-ui,sans-serif';x.fillText(Math.floor(dist)+' m   ·   Ovnis : '+kills,16,54);x.globalAlpha=1;
    x.fillStyle=DOT;x.fillRect(16,64,100,6);x.fillStyle=hot?'#ff3b3b':INK;x.fillRect(16,64,100*(hot?cool/5:heat/5),6);
  }
  if(state==='ready'){text('Esquive météorites',H/2-36,28);text('Glisse le pouce en bas pour piloter',H/2,17,.8);text('Appuie pour tirer (surchauffe après 5 s)',H/2+26,17,.8);text('Touche pour jouer',H/2+62,17,.8)}
  if(state==='over'){text('Touché',H/2-62,32);text(pts()+' pts',H/2-22,24);text(Math.floor(dist)+' m   ·   Ovnis abattus : '+kills,H/2+8,16,.8);text('Record : '+best+' pts',H/2+36,16,.8);text('Touche pour rejouer',H/2+72,17,.8)}
}

let prev=performance.now();
function loop(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
